[window]
opacity = 0.95

[font]
size = 9.0

#[mouse]
#bindings = [{ mouse = "Middle", action = "None" }]

#[scrolling]
#multiplier = 0

[font.bold]
family = "Iosevka NFM"
style = "Heavy"

[font.bold_italic]
